# Cloudflare Worker config — only needed for terminal deploys (`npx wrangler deploy`).
# The API key is NOT stored here. Add it with:  npx wrangler secret put ANTHROPIC_API_KEY
name = "duel-ai"
main = "cloudflare-worker.js"
compatibility_date = "2026-11-01"

[vars]
# Put your site's address here once it is final, e.g. "https://duel.netlify.app".
# "*" lets any site call the Worker (fine for testing).
ALLOWED_ORIGIN = "*"
